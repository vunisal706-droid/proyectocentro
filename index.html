<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Centro · CEIP Capitulaciones</title>
<meta name="description" content="Consulta del Plan de Centro del CEIP Capitulaciones de Santa Fe (Granada): Proyecto Educativo, ROF, Proyecto de Gestión, anexos y programaciones didácticas.">
<meta name="theme-color" content="#b91c1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#b91c1c; --primary-light:#fee2e2; --primary-dark:#991b1b;
  --secondary:#b45309;
  /* acento dinámico: cambia según el documento que se consulta */
  --accent:#b91c1c; --accent-light:#fee2e2; --accent-dark:#991b1b; --accent-soft:#fff5f5;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --border:#e7e5e4;
  --text:#1c1917; --muted:#78716c;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 8px 22px rgba(0,0,0,.08);
  --sidebar-w:310px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
}
body[data-accent="inicio"]  {--accent:#b91c1c;--accent-light:#fee2e2;--accent-dark:#991b1b;--accent-soft:#fff5f5;}
body[data-accent="respe"]   {--accent:#d97706;--accent-light:#fef3c7;--accent-dark:#b45309;--accent-soft:#fffbeb;}
body[data-accent="resrof"]  {--accent:#d97706;--accent-light:#fef3c7;--accent-dark:#b45309;--accent-soft:#fffbeb;}
body[data-accent="resgest"] {--accent:#d97706;--accent-light:#fef3c7;--accent-dark:#b45309;--accent-soft:#fffbeb;}
body[data-accent="pe"]      {--accent:#2563eb;--accent-light:#dbeafe;--accent-dark:#1d4ed8;--accent-soft:#f0f7ff;}
body[data-accent="rof"]     {--accent:#7c3aed;--accent-light:#ede9fe;--accent-dark:#6d28d9;--accent-soft:#faf7ff;}
body[data-accent="gestion"] {--accent:#0d9488;--accent-light:#ccfbf1;--accent-dark:#0f766e;--accent-soft:#f2fdfa;}
body[data-accent="anexos"]  {--accent:#16a34a;--accent-light:#dcfce7;--accent-dark:#15803d;--accent-soft:#f4fdf6;}
body[data-accent="descargas"]{--accent:#db2777;--accent-light:#fce7f3;--accent-dark:#be185d;--accent-soft:#fff5fa;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); font-size:16px; color:var(--text);
  background:#fdfcfb; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background-color .5s ease;
}

/* ============ FONDO AURORA ============ */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:#fdfcfb;}
.aurora span{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.62;
  will-change:transform;
}
.aurora .b1{width:52vw;height:52vw;left:-12vw;top:-14vw;background:radial-gradient(circle,#fecaca,#fca5a5 45%,transparent 70%);animation:drift1 11s ease-in-out infinite;}
.aurora .b2{width:44vw;height:44vw;right:-10vw;top:-6vw;background:radial-gradient(circle,#bfdbfe,#93c5fd 45%,transparent 70%);animation:drift2 13s ease-in-out infinite;}
.aurora .b3{width:48vw;height:48vw;left:18vw;bottom:-22vw;background:radial-gradient(circle,#fde68a,#fcd34d 45%,transparent 70%);animation:drift3 12s ease-in-out infinite;opacity:.45;}
.aurora .b4{width:38vw;height:38vw;right:2vw;bottom:-14vw;background:radial-gradient(circle,#bbf7d0,#86efac 45%,transparent 70%);animation:drift4 14s ease-in-out infinite;opacity:.4;}
.aurora .b5{width:34vw;height:34vw;left:44vw;top:22vh;background:radial-gradient(circle,#e9d5ff,#d8b4fe 45%,transparent 70%);animation:drift2 15s ease-in-out infinite reverse;opacity:.35;}
.aurora::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.78));}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(24vw,16vh) scale(1.3)}66%{transform:translate(-12vw,26vh) scale(.8)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26vw,22vh) scale(1.35)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-22vw,-20vh) scale(1.28)}75%{transform:translate(18vw,-12vh) scale(.85)}}
@keyframes drift4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(22vw,-24vh) scale(1.35)}}
@media(prefers-reduced-motion:reduce){.aurora span{animation:none!important;}}
a{color:var(--primary-dark);}
button{font-family:inherit;}

/* ============ CABECERA ============ */
header.top{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,0,0,.06); box-shadow:0 1px 12px rgba(0,0,0,.04);
}
header.top::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;
  background:linear-gradient(90deg,#b91c1c,#d97706,#2563eb,#7c3aed,#0d9488,#16a34a,#db2777);
  opacity:.85;
}
.top-inner{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.logo{
  width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:#fff;padding:3px;
  border:1px solid rgba(0,0,0,.06);box-shadow:0 3px 10px rgba(0,0,0,.08);
  display:grid;place-items:center;overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:contain;display:block;}
.brand h1{font-size:1.02rem;margin:0;font-weight:800;line-height:1.15;}
.brand p{margin:1px 0 0;font-size:.74rem;color:var(--muted);font-weight:500;}
.searchbox{margin-left:auto;position:relative;flex:1;max-width:340px;}
.searchbox input{
  width:100%;padding:10px 14px 10px 38px;border:1px solid rgba(0,0,0,.08);border-radius:999px;
  font-size:16px;font-family:inherit;background:rgba(255,255,255,.75);color:var(--text);
}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff;}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45;}
.icon-btn{
  border:1px solid var(--border);background:#fff;border-radius:10px;width:42px;height:42px;
  display:none;place-items:center;cursor:pointer;flex:0 0 42px;font-size:20px;
}

/* ============ PESTAÑAS ============ */
nav.tabs{
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:66px;z-index:40;
}
.tabs-inner{max-width:1400px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;}
.tabs-inner::-webkit-scrollbar{display:none;}
.tab{
  border:none;background:none;padding:13px 15px;font-size:.9rem;font-weight:600;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--text);background:rgba(255,255,255,.7);}
.tab[data-tab="inicio"].active   {color:#b91c1c;border-bottom-color:#b91c1c;}
.tab[data-tab="resumen"].active  {color:#b45309;border-bottom-color:#d97706;}
.tab[data-tab="pe"].active       {color:#1d4ed8;border-bottom-color:#2563eb;}
.tab[data-tab="rof"].active      {color:#6d28d9;border-bottom-color:#7c3aed;}
.tab[data-tab="anexos"].active   {color:#15803d;border-bottom-color:#16a34a;}
.tab[data-tab="descargas"].active{color:#be185d;border-bottom-color:#db2777;}
.tab.active{background:rgba(255,255,255,.85);}

/* ============ LAYOUT ============ */
.layout{max-width:1400px;margin:0 auto;display:flex;gap:0;align-items:flex-start;}
aside{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:116px;
  height:calc(100vh - 116px);overflow-y:auto;padding:18px 12px 40px;
  border-right:1px solid rgba(0,0,0,.06);
}
.side-group{margin-bottom:20px;}
.side-group h2{
  font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-dark);
  margin:0 0 8px 10px;font-weight:800;display:flex;align-items:center;gap:7px;
}
.side-group h2::before{content:'';width:14px;height:3px;border-radius:2px;background:var(--accent);flex:0 0 14px;}
.side-item{
  display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:9px 12px;border-radius:var(--radius-sm);font-size:.855rem;line-height:1.35;color:#44403c;
  font-weight:500;margin-bottom:1px;
}
.side-item{border-left:3px solid transparent;transition:background .15s,border-color .15s;}
.side-item:hover{background:rgba(255,255,255,.75);color:var(--accent-dark);}
.side-item.active{
  background:var(--accent-light);color:var(--accent-dark);font-weight:700;
  border-left-color:var(--accent);
}
main{flex:1;min-width:0;padding:26px 30px 80px;}

/* ============ CONTENIDO ============ */
.crumb{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.doc-title{font-size:clamp(1.4rem,3.2vw,2rem);font-weight:800;line-height:1.18;margin:0 0 4px;letter-spacing:-.02em;}
.doc-sub{color:var(--muted);font-size:.85rem;margin:0 0 20px;}
.divider{
  height:4px;width:72px;border-radius:3px;margin:0 0 24px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 30%,#fbbf24));
}
.content{
  max-width:900px;font-size:1.005rem;line-height:1.72;
  background:rgba(255,255,255,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.8);border-radius:var(--radius-lg);
  padding:26px 30px;box-shadow:0 6px 26px rgba(0,0,0,.05);
}
.content p{margin:0 0 13px;}
.content p.li{margin:0 0 7px;padding-left:18px;}
.content h2{
  font-size:1.32rem;font-weight:800;letter-spacing:-.01em;margin:38px 0 16px;
  color:var(--accent-dark);scroll-margin-top:140px;padding:10px 0 12px;
  border-bottom:3px solid var(--accent-light);
}
.content h2:first-child{margin-top:4px;}
.content h3{
  font-size:1.09rem;font-weight:700;margin:30px 0 12px;color:var(--accent-dark);
  scroll-margin-top:140px;padding:7px 0 7px 14px;border-left:4px solid var(--accent);
  background:linear-gradient(90deg,var(--accent-soft),transparent 70%);border-radius:0 8px 8px 0;
}
.content h3:first-child{margin-top:0;}
.tabla-wrap{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--border);border-radius:var(--radius-md);}
.content table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:520px;background:#fff;}
.content th{background:var(--accent-light);color:var(--accent-dark);text-align:left;font-weight:700;}
.content th,.content td{border:1px solid var(--border);padding:9px 11px;vertical-align:top;line-height:1.5;}
.content tr:nth-child(even) td{background:var(--accent-soft);}
.toc{
  background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.06);border-left:5px solid var(--accent);
  border-radius:var(--radius-md);padding:14px 18px;margin:0 0 22px;max-width:900px;
  box-shadow:var(--shadow-sm);
}
.toc strong{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-dark);}
.toc ul{margin:8px 0 0;padding-left:18px;columns:2;column-gap:26px;}
.toc li{font-size:.845rem;margin-bottom:4px;break-inside:avoid;}
.toc a{color:#44403c;text-decoration:none;}
.toc a:hover{color:var(--accent);text-decoration:underline;}
.pager{display:flex;justify-content:space-between;gap:12px;margin:44px 0 0;max-width:900px;}
.pager button{
  border:1px solid rgba(0,0,0,.07);background:rgba(255,255,255,.85);border-radius:var(--radius-md);
  padding:11px 16px;font-size:.84rem;font-weight:600;cursor:pointer;color:#44403c;max-width:46%;text-align:left;
}
.pager button:hover{border-color:var(--accent);color:var(--accent-dark);background:#fff;}
.pager button:disabled{opacity:.35;cursor:default;}

/* ============ PORTADA / CARDS ============ */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(254,226,226,.85),rgba(255,255,255,.9) 45%,rgba(219,234,254,.8));
  border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-lg);padding:32px 30px;margin-bottom:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}
.hero::before{
  content:'';position:absolute;right:-40px;top:-60px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(252,211,77,.55),transparent 70%);
}
.hero h2{background:linear-gradient(90deg,#b91c1c,#d97706 55%,#7c3aed);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.hero{display:flex;align-items:center;gap:28px;}
.hero .hero-txt{position:relative;z-index:1;}
.hero-logo{
  flex:0 0 140px;width:140px;position:relative;z-index:1;
  background:rgba(255,255,255,.75);border-radius:20px;padding:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
.hero-logo img{width:100%;display:block;}
.hero h2{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;letter-spacing:-.02em;}
.hero p{margin:0;color:var(--muted);font-size:.95rem;max-width:640px;line-height:1.6;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{
  position:relative;overflow:hidden;
  background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.9);border-radius:var(--radius-lg);padding:20px 20px 18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);cursor:pointer;text-align:left;
  transition:transform .18s,box-shadow .18s;
}
.card::before{content:'';position:absolute;left:0;top:0;height:100%;width:5px;background:var(--c,var(--accent));}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.11);}
.card .ico{
  font-size:1.25rem;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;
  margin-bottom:11px;background:var(--cl,var(--accent-light));
}
.card h3{color:var(--cd,inherit);}
.card h3{margin:0 0 5px;font-size:.98rem;font-weight:700;line-height:1.3;}
.card p{margin:0;font-size:.81rem;color:var(--muted);line-height:1.5;}
.badge{
  display:inline-block;background:var(--cl,var(--accent-light));color:var(--cd,var(--accent-dark));
  border-radius:999px;padding:4px 11px;font-size:.7rem;font-weight:700;margin-top:11px;
}

/* ============ DESCARGAS ============ */
.dl-group{margin-bottom:26px;}
.dl-group h3{
  font-size:.98rem;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:9px;
  color:var(--accent-dark);
}
.dl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px;}
.dl{
  display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.85);
  border:1px solid rgba(0,0,0,.06);border-radius:var(--radius-md);padding:12px 14px;
  text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s,box-shadow .15s;
}
.dl:hover{border-color:var(--accent);background:#fff;transform:translateX(3px);box-shadow:var(--shadow-sm);}
.dl .fic{
  width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:#dbeafe;color:#1d4ed8;
  display:grid;place-items:center;font-size:.66rem;font-weight:800;
}
.dl .txt{min-width:0;}
.dl .txt b{display:block;font-size:.855rem;font-weight:600;line-height:1.3;}
.dl .txt span{font-size:.73rem;color:var(--muted);}
.notice{
  background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #d97706;border-radius:var(--radius-md);
  padding:13px 16px;font-size:.855rem;line-height:1.55;margin-bottom:20px;color:#78350f;
}

/* ============ BUSCADOR ============ */
.results{max-width:900px;}
.result{
  background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.06);border-left:4px solid var(--accent);
  border-radius:var(--radius-md);padding:14px 16px;margin-bottom:9px;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.result:hover{background:#fff;transform:translateX(3px);box-shadow:var(--shadow-sm);}
.result b{display:block;font-size:.92rem;margin-bottom:3px;}
.result .where{font-size:.72rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.result p{margin:5px 0 0;font-size:.83rem;color:var(--muted);line-height:1.5;}
mark{background:#fef08a;color:inherit;padding:0 2px;border-radius:3px;}
.empty{color:var(--muted);font-size:.9rem;padding:20px 0;}

/* ============ RESPONSIVE ============ */
.backdrop{display:none;}
@media(max-width:980px){
  nav.tabs{top:64px;}
  .icon-btn{display:grid;}
  aside{
    position:fixed;top:0;left:0;height:100vh;z-index:80;background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);transform:translateX(-105%);
    transition:transform .25s ease;box-shadow:var(--shadow-md);padding-top:20px;width:290px;flex-basis:290px;
  }
  aside.open{transform:translateX(0);}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;}
  main{padding:20px 16px 70px;}
  .toc ul{columns:1;}
  .hero{flex-direction:column;text-align:center;gap:16px;}
  .hero-logo{flex-basis:110px;width:110px;}
  .content{padding:20px 18px;}
  .brand p{display:none;}
  .searchbox{max-width:none;}
  .brand h1{font-size:.9rem;}
}
@media(max-width:560px){
  .top-inner{flex-wrap:wrap;}
  .searchbox{order:3;flex-basis:100%;max-width:none;margin:4px 0 6px;}
}
@media print{
  header.top,nav.tabs,aside,.pager,.toc,.icon-btn,.aurora{display:none!important;}
  .content{background:#fff;border:none;box-shadow:none;padding:0;}
  main{padding:0;}
  .content{max-width:none;font-size:11pt;}
  .tabla-wrap{overflow:visible;}
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
</div>

<header class="top">
  <div class="top-inner">
    <button class="icon-btn" id="btnMenu" aria-label="Índice">☰</button>
    <div class="brand">
      <div class="logo"><img src="icons/icon-192.png" alt="Escudo del CEIP Capitulaciones"></div>
      <div>
        <h1>Plan de Centro</h1>
        <p>CEIP Capitulaciones · Santa Fe (Granada)</p>
      </div>
    </div>
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar en todo el Plan de Centro…" autocomplete="off">
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabs"></div>
</nav>

<div class="layout">
  <div class="backdrop" id="backdrop"></div>
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script src="data/resumenes.js"></script>
<script src="data/pe.js"></script>
<script src="data/rof.js"></script>
<script src="data/gestion.js"></script>
<script src="data/anexos.js"></script>
<script>
/* =========================================================
   PLAN DE CENTRO · CEIP CAPITULACIONES
   Consulta del Plan de Centro y descarga de programaciones
   ========================================================= */
const D = window.DATA || {};

const TABS = [
  {id:'inicio',   label:'Inicio',              ico:'🏠', groups:[]},
  {id:'resumen',  label:'Resúmenes',           ico:'⚡', groups:[
      {key:'resumenes', label:'Las tres partes del Plan de Centro, en versión breve'}]},
  {id:'pe',       label:'Proyecto Educativo',  ico:'📘', groups:[
      {key:'pe',      label:'Apartados A – P'}]},
  {id:'rof',      label:'ROF y Gestión',       ico:'⚖️', groups:[
      {key:'rof',     label:'Reglamento de Organización y Funcionamiento'},
      {key:'gestion', label:'Proyecto de Gestión'}]},
  {id:'anexos',   label:'Anexos',              ico:'📎', groups:[
      {key:'anexos',  label:'Planes que desarrollan el Proyecto Educativo'}]},
  {id:'descargas',label:'Programaciones',      ico:'⬇️', groups:[]}
];

const AREAS = [
  ['Lengua Castellana y Literatura','Programacion_Lengua'],
  ['Matemáticas','Programacion_Matematicas'],
  ['Conocimiento del Medio Natural, Social y Cultural','Programacion_Conocimiento_del_Medio'],
  ['Educación Artística','Programacion_Educacion_Artistica'],
  ['Educación Física','Programacion_Educacion_Fisica'],
  ['Lengua Extranjera: Inglés','Programacion_Ingles'],
  ['Religión Católica','Programacion_Religion_Catolica']
];
const CICLOS = [['1_ciclo','1.º y 2.º'],['2_ciclo','3.º y 4.º'],['3_ciclo','5.º y 6.º']];

const COLORVARS = {
  inicio:   '--c:#b91c1c;--cl:#fee2e2;--cd:#991b1b',
  respe:    '--c:#d97706;--cl:#fef3c7;--cd:#b45309',
  resrof:   '--c:#ea580c;--cl:#ffedd5;--cd:#c2410c',
  resgest:  '--c:#ca8a04;--cl:#fef9c3;--cd:#a16207',
  pe:       '--c:#2563eb;--cl:#dbeafe;--cd:#1d4ed8',
  rof:      '--c:#7c3aed;--cl:#ede9fe;--cd:#6d28d9',
  gestion:  '--c:#0d9488;--cl:#ccfbf1;--cd:#0f766e',
  anexos:   '--c:#16a34a;--cl:#dcfce7;--cd:#15803d',
  descargas:'--c:#db2777;--cl:#fce7f3;--cd:#be185d'
};
const ACCENT_BY_TAB = {inicio:'inicio', resumen:'respe', pe:'pe', rof:'rof', anexos:'anexos', descargas:'descargas'};

let state = {tab:'inicio', sec:null, query:''};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const strip = h => h.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function allSections(){
  const out = [];
  TABS.forEach(t => t.groups.forEach(g => (D[g.key]||[]).forEach(s =>
    out.push({...s, tab:t.id, tabLabel:t.label, groupLabel:g.label}))));
  return out;
}
const INDEX = allSections().map(s => ({ref:s, text:norm(s.titulo+' '+strip(s.html))}));

function findSection(id){
  for (const t of TABS) for (const g of t.groups) {
    const s = (D[g.key]||[]).find(x => x.id===id);
    if (s) return {...s, tab:t.id, tabLabel:t.label, groupLabel:g.label, key:g.key};
  }
  return null;
}
/* ---------- Soporte de anclas de segundo nivel ----------
   Las subsecciones viven en s.subs y su id ya está impreso en el
   html del apartado padre. findSection solo miraba el primer nivel,
   así que un enlace externo del tipo #pe-e-e-7-promocion-del-alumnado
   no se resolvía y caía en el índice. Esto lo arregla. */
function findSub(id){
  for (const t of TABS) for (const g of t.groups) {
    for (const s of (D[g.key]||[])) {
      if ((s.subs||[]).some(x => x.id === id))
        return {...s, tab:t.id, tabLabel:t.label, groupLabel:g.label, key:g.key};
    }
  }
  return null;
}
/* Devuelve el apartado que hay que abrir, sea un id de primer nivel o de subsección */
function resolve(id){ return findSection(id) || findSub(id); }

/* Lleva la vista hasta la subsección una vez pintado el apartado */
function scrollToAnchor(id){
  if (!id) return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }));
}

function siblings(id){
  const s = findSection(id); if(!s) return [null,null];
  const arr = D[s.key]||[]; const i = arr.findIndex(x=>x.id===id);
  return [arr[i-1]||null, arr[i+1]||null];
}

/* ---------- pestañas ---------- */
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t =>
    `<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}"><span>${t.ico}</span>${t.label}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(b =>
    b.onclick = () => go(b.dataset.tab, null));
}

/* ---------- barra lateral ---------- */
function renderSidebar(){
  const tab = TABS.find(t=>t.id===state.tab);
  const side = $('#sidebar');
  if (!tab || !tab.groups.length){ side.innerHTML=''; side.style.display='none'; return; }
  side.style.display='';
  side.innerHTML = tab.groups.map(g => `
    <div class="side-group">
      <h2>${g.label}</h2>
      ${(D[g.key]||[]).map(s =>
        `<button class="side-item ${state.sec===s.id?'active':''}" data-sec="${s.id}">${s.titulo}</button>`).join('')}
    </div>`).join('');
  side.querySelectorAll('.side-item').forEach(b =>
    b.onclick = () => { go(state.tab, b.dataset.sec); closeDrawer(); });
}

/* ---------- vistas ---------- */
function viewInicio(){
  const bloques = [
    {ico:'⚡', t:'Resúmenes prácticos', d:'El Proyecto Educativo en 20 páginas y el ROF con el Proyecto de Gestión en 17. Lo esencial, en lenguaje claro.', tab:'resumen', b:'3 documentos', c:'respe'},
    {ico:'📘', t:'Proyecto Educativo', d:'Apartados A a P: objetivos propios, currículo, evaluación, atención a la diversidad, convivencia, planes y programas.', tab:'pe', b:'18 apartados', c:'pe'},
    {ico:'⚖️', t:'ROF y Proyecto de Gestión', d:'Organización y funcionamiento del centro, órganos de gobierno, espacios, recreos, autoprotección y gestión económica.', tab:'rof', b:'10 + 7 apartados', c:'rof'},
    {ico:'📎', t:'Anexos', d:'Atención a la Diversidad, Orientación y Acción Tutorial, Convivencia y Currículo Integrado de las Lenguas.', tab:'anexos', b:'4 planes', c:'anexos'},
    {ico:'⬇️', t:'Programaciones didácticas', d:'Las 23 programaciones de Primaria y la propuesta pedagógica de Infantil, listas para descargar en Word.', tab:'descargas', b:'24 documentos', c:'descargas'}
  ];
  return `
    <div class="hero">
      <div class="hero-logo"><img src="icons/logo-512.png" alt="CEIP Capitulaciones · Santa Fe"></div>
      <div class="hero-txt">
        <h2>Plan de Centro</h2>
        <p>Documento que recoge la organización, el funcionamiento y la propuesta educativa del CEIP Capitulaciones,
        conforme al artículo 20 del Decreto 328/2010, de 13 de julio. Se compone del Proyecto Educativo, el Reglamento
        de Organización y Funcionamiento y el Proyecto de Gestión.</p>
      </div>
    </div>
    <div class="cards">
      ${bloques.map(b=>`
        <button class="card" data-goto="${b.tab}" style="${COLORVARS[b.c]}">
          <span class="ico">${b.ico}</span>
          <h3>${b.t}</h3>
          <p>${b.d}</p>
          <span class="badge">${b.b}</span>
        </button>`).join('')}
    </div>`;
}

function viewIndice(tab){
  return `
    <div class="crumb">${tab.label}</div>
    <h2 class="doc-title">${tab.groups.map(g=>g.label).join(' · ')}</h2>
    <div class="divider"></div>
    ${tab.id==='anexos'?`<p style="max-width:900px;color:var(--muted);line-height:1.65;font-size:.93rem;margin:0 0 22px">
      Documentos que se incorporan al Proyecto Educativo con el mismo valor y la misma exigencia, conforme al
      artículo 21.3 del Decreto 328/2010. Desarrollan los apartados F, H, J y C.5 del Proyecto Educativo.</p>`:''}
    <div class="cards">
      ${tab.groups.map(g => (D[g.key]||[]).map(s => `
        <button class="card" data-sec="${s.id}" style="${COLORVARS[s.accent||g.key]||COLORVARS[tab.id]||''}">
          <h3>${s.titulo}</h3>
          <p>${strip(s.html).slice(0,120)}…</p>
          ${s.subs.length?`<span class="badge">${s.subs.length} apartados</span>`:''}
        </button>`).join('')).join('')}
    </div>`;
}

function viewSeccion(id){
  const s = findSection(id); if(!s) return viewInicio();
  const [prev,next] = siblings(id);
  return `
    <div class="crumb">${s.tabLabel} · ${s.groupLabel}</div>
    <h1 class="doc-title">${s.titulo}</h1>
    <p class="doc-sub">${s.encabezado||''}</p>
    <div class="divider"></div>
    ${s.subs.length>2?`<div class="toc"><strong>En este apartado</strong><ul>
      ${s.subs.map(x=>`<li><a href="#${x.id}">${x.titulo}</a></li>`).join('')}</ul></div>`:''}
    <div class="content">${s.html}</div>
    <div class="pager">
      <button ${prev?`data-sec="${prev.id}"`:'disabled'}>${prev?'← '+prev.titulo:''}</button>
      <button ${next?`data-sec="${next.id}"`:'disabled'} style="text-align:right">${next?next.titulo+' →':''}</button>
    </div>`;
}

function viewDescargas(){
  const prog = AREAS.map(([area,base]) => `
    <div class="dl-group">
      <h3>📗 ${area}</h3>
      <div class="dl-list">
        ${CICLOS.map(([c,lab]) => `
          <a class="dl" href="descargas/programaciones/${base}_${c}.docx" download>
            <span class="fic">DOC</span>
            <span class="txt"><b>${area}</b><span>${lab} · ${lab==='1.º y 2.º'?'Primer':lab==='3.º y 4.º'?'Segundo':'Tercer'} ciclo</span></span>
          </a>`).join('')}
      </div>
    </div>`).join('');
  return `
    <div class="crumb">Descargas</div>
    <h1 class="doc-title">Programaciones didácticas y propuesta pedagógica</h1>

      Documentos en formato Word que se incorporan al Proyecto Educativo conforme al artículo 27 del Decreto 328/2010
      y al artículo 4.2 de la Orden de 30 de mayo de 2023. Se revisan en septiembre y se les incorpora el anexo de
      concreción antes del 15 de octubre.</p>
    <div class="dl-group">
      <h3>📦 Descarga completa</h3>
      <div class="dl-list">
        <a class="dl" href="descargas/Programaciones_y_propuesta_pedagogica_Capitulaciones.zip" download>
          <span class="fic" style="background:#fef3c7;color:#b45309">ZIP</span>
          <span class="txt"><b>Todas las programaciones + propuesta pedagógica</b><span>24 documentos · un solo archivo</span></span>
        </a>
      </div>
    </div>
    <div class="dl-group">
      <h3>🌐 Anexos del Proyecto Educativo</h3>
      <div class="dl-list">
        <a class="dl" href="descargas/CIL_Capitulaciones.docx" download>
          <span class="fic" style="background:#dcfce7;color:#15803d">DOC</span>
          <span class="txt"><b>Currículo Integrado de las Lenguas (CIL)</b><span>Programa de centro bilingüe · también consultable en Anexos</span></span>
        </a>
      </div>
    </div>
    <div class="dl-group">
      <h3>🧸 Educación Infantil</h3>
      <div class="dl-list">
        <a class="dl" href="descargas/Propuesta_pedagogica_Infantil.docx" download>

        </a>

    </div>
    ${prog}
    <div class="dl-group">
      <h3>🌍 Otras áreas</h3>
      <div class="dl-list">
        <a class="dl" href="descargas/programaciones/Programacion_Frances_Segunda_Lengua_3_ciclo.docx" download>

        <a class="dl" href="descargas/programaciones/Programacion_Valores_Civicos_y_Eticos_3_ciclo.docx" download>
          <span class="fic">DOC</span>
          <span class="txt"><b>Educación en Valores Cívicos y Éticos</b><span>6.º · Tercer ciclo</span></span></a>
      </div>
    </div>

      Resolución de 21 de junio de 2022 (BOE de 24 de junio de 2022). La programación la elabora el profesorado
      que imparte el área y se incorpora al Proyecto Educativo con el mismo valor que el resto.
    </div>`;
}

function viewBusqueda(q){
  const nq = norm(q);
  const hits = INDEX.filter(i => i.text.includes(nq)).slice(0,40);
  if (!hits.length) return `<h1 class="doc-title">Sin resultados</h1><div class="divider"></div>
    <p class="empty">No se ha encontrado «${q}» en el Plan de Centro. Prueba con otra palabra.</p>`;
  return `
    <div class="crumb">Búsqueda</div>
    <h1 class="doc-title">${hits.length} resultado${hits.length>1?'s':''} para «${q}»</h1>
    <div class="divider"></div>
    <div class="results">${hits.map(h=>{
      const txt = strip(h.ref.html);
      const p = norm(txt).indexOf(nq);
      let frag = p<0 ? txt.slice(0,180) : txt.slice(Math.max(0,p-90), p+130);
      frag = frag.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
      return `<div class="result" data-sec="${h.ref.id}" data-tab="${h.ref.tab}">
        <span class="where">${h.ref.tabLabel} · ${h.ref.groupLabel}</span>
        <b>${h.ref.titulo}</b><p>…${frag}…</p></div>`;
    }).join('')}</div>`;
}

/* ---------- render ---------- */
function render(){
  const main = $('#main');
  if (state.query){ main.innerHTML = viewBusqueda(state.query); }
  else if (state.tab==='inicio'){ main.innerHTML = viewInicio(); }
  else if (state.tab==='descargas'){ main.innerHTML = viewDescargas(); }
  else if (state.sec){ main.innerHTML = viewSeccion(state.sec); }
  else { main.innerHTML = viewIndice(TABS.find(t=>t.id===state.tab)); }

  let acc = ACCENT_BY_TAB[state.tab] || 'inicio';
  if (state.sec && !state.query){ const s = findSection(state.sec); if (s) acc = s.accent || s.key; }
  document.body.dataset.accent = acc;

  main.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto,null));
  main.querySelectorAll('[data-sec]').forEach(b =>
    b.onclick = () => go(b.dataset.tab || state.tab, b.dataset.sec));
  renderTabs(); renderSidebar();
  if (state.anchor) { scrollToAnchor(state.anchor); state.anchor = null; }
  else window.scrollTo({top:0,behavior:'instant'});
}

function go(tab, sec){
  state.tab = tab; state.query='';
  $('#q').value='';
  state.sec = sec; state.anchor = null;
  if (sec){
    const s = resolve(sec);
    if (s){
      state.tab = s.tab;
      state.sec = s.id;                       // el apartado que se pinta
      if (s.id !== sec) state.anchor = sec;   // la subsección a la que ir
    }
  }
  location.hash = sec ? sec : tab;
  render();
}

/* ---------- eventos ---------- */
let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  timer = setTimeout(() => {
    state.query = v.length>2 ? v : '';
    if (!state.query && !state.sec && state.tab==='inicio') return render();
    render();
  }, 220);
});

function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }
$('#btnMenu').onclick = () => { $('#sidebar').classList.toggle('open'); $('#backdrop').classList.toggle('show'); };
$('#backdrop').onclick = closeDrawer;

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (!h) return;
  if (h.startsWith('#')) return;
  const s = resolve(h);
  if (!s) return;
  const anchor = (s.id !== h) ? h : null;
  if (s.id !== state.sec){
    state.tab = s.tab; state.sec = s.id; state.query = ''; state.anchor = anchor;
    render();
  } else if (anchor){
    scrollToAnchor(anchor);   // ya estamos en el apartado: solo hay que bajar
  }
});

/* ---------- arranque ---------- */
(function init(){
  const h = location.hash.slice(1);
  const s = h && resolve(h);
  if (s){
    state.tab = s.tab; state.sec = s.id;
    if (s.id !== h) state.anchor = h;
  }
  else if (h && TABS.some(t=>t.id===h)) state.tab = h;
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
